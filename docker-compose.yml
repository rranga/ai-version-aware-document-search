# Local stack: API on http://localhost:8000 + Ollama.
#   docker compose up --build
#   docker compose exec ollama ollama pull llama3.2
services:
  api:
    build:
      context: ./backend
      args:
        WITH_OLLAMA: "false"
    ports:
      - "8000:7860"
    environment:
      AT_OLLAMA_BASE_URL: http://ollama:11434
      AT_OLLAMA_MODEL: llama3.2
      START_OLLAMA: "false"
    volumes:
      - api-data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  api-data:
  ollama-models:
